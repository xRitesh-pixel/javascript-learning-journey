<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM projects</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .js-subscribe-button {
            border: none;
            background-color: black;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .subscribed {
            background-color: rgba(138, 135, 135, 0.626);
            color: black;
        }

        .cost-input {
            font-size: 16px;
            padding: 10px;

        }
        
        .calculate-button{
            background-color: green;
            color: white;
            border: none;
            font-size: 16px;
            padding: 11px 20px;
            border-radius: 5px;
        }

    </style>


</head>
<body>
    <h1>Youtube Subscribe Button</h1>
    <button onclick="
        subscribe();
    "class = "js-subscribe-button">Subscribe</button>

    <p>Amazon Shipping Calculator</p>
    <input placeholder="Cost of order" class="js-cost-of-order cost-input" onkeydown="
    handleCostKeydown(event);
    "></input>


    <button onclick="
    shippingCost();
    " class="calculate-button">Calculate</button>
    <p class="js-total-cost"></p>

    <script>
    
    // window.document
    // window.console.log('window.document');
    // window.console.log(document);
    
    

    function shippingCost() {
        const costInput = document.querySelector('.js-cost-of-order');
        const cost = Number(costInput.value);
        let totalCost = cost;

        if (cost < 40){
            totalCost = cost + 10;
        }
        
        document.querySelector('.js-total-cost')
            .innerHTML = `Total cost: $${totalCost}`;
    }
    function subscribe() {
        const buttonElement = document.querySelector('.js-subscribe-button');

    if (buttonElement.innerText === 'Subscribe') {
        buttonElement.innerText = 'Subscribed';
        buttonElement.classList.add('subscribed');
    } else {
        buttonElement.innerText = 'Subscribe';
        buttonElement.classList.remove('subscribed');
    }
    }

    function handleCostKeydown(event) {
        if (event.key === 'Enter') {
            shippingCost();
        }
    }
    </script>
</body>
</html>
